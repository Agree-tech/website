<section class="page-hero{{#if dark}} dark{{/if}}">
  <div class="container page-hero-grid">
    <div>
      <div class="eyebrow{{#if dark}} on-dark{{/if}}"><span class="dot"{{prop:dotStyle}}></span>{{slot:eyebrow}}</div>
      <h1>{{slot:heading}}</h1>
      <p class="lede">{{slot:body}}</p>
{{#if links}}      <div class="ctas">
{{#each links}}        {{partial:button}}
{{/each}}      </div>
{{/if}}    </div>
    {{include:visual}}
  </div>
</section>
