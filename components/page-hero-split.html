<section class="page-hero{{#if dark}} dark{{/if}}">
  <div class="container page-hero-grid">
    <div>
      <div class="eyebrow{{#if dark}} on-dark{{/if}}"><span class="dot"{{prop:dotStyle}}></span>{{slot:eyebrow}}</div>
      <h1>{{slot:heading}}</h1>
      <p class="lede">{{slot:body}}</p>
      <div class="ctas">
        <a class="btn {{prop:primaryClass}} btn-lg" href="{{prop:primaryHref}}">{{slot:primary}}</a>
        <a class="btn {{prop:secondaryClass}} btn-lg" href="{{prop:secondaryHref}}">{{slot:secondary}}{{#if arrow}} <span class="arr">→</span>{{/if}}</a>
      </div>
    </div>
    {{include:visual}}
  </div>
</section>
