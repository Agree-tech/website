<section class="cta-band{{#if dark}}-dark{{/if}}">
  <div class="container"{{#if narrow}} style="max-width:760px"{{/if}}>
    <div class="eyebrow{{#if dark}} on-dark{{/if}}"><span class="dot"></span>{{slot:eyebrow}}</div>
    <h2 style="{{#if dark}}margin-top:18px{{else}}margin-top: 22px;{{/if}}">{{slot:heading}}</h2>
{{#if body}}    <p{{prop:bodyClass}}>{{slot:body}}</p>
{{/if}}    <div class="ctas">
      <a class="btn btn-{{#if dark}}cyan{{else}}blue{{/if}} btn-lg" href="{{prop:primaryHref}}">{{slot:primary}}</a>
      <a class="btn btn-{{#if dark}}outline-dark{{else}}ghost{{/if}} btn-lg" href="{{prop:secondaryHref}}">{{slot:secondary}}{{#if dark}}{{else}} <span class="arr">→</span>{{/if}}</a>
    </div>
  </div>
</section>
