<section class="split-section">
  <div class="container">
    <div class="kicker">
      <div class="eyebrow"><span class="dot"></span>{{slot:eyebrow}}</div>
      <h2 style="margin-top:18px">{{slot:heading}}</h2>
    </div>
    <div class="imp-rail">
{{#each steps}}      <div class="imp-step">
        <div class="num-circle"></div>
        <h3>{{slot:heading}}</h3>
        <p>{{slot:body}}</p>
      </div>
{{/each}}    </div>
  </div>
</section>
