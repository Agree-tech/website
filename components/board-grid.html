<section class="split-section">
  <div class="container">
    <div class="kicker"><div class="eyebrow"><span class="dot"></span>{{slot:eyebrow}}</div><h2 style="margin-top:18px">{{slot:heading}}</h2></div>
    <div class="board-grid">
{{#each people}}      <div class="board">
        <div class="board-photo"><img src="{{prop:image}}" alt="{{slot:alt}}" /></div>
        <div class="board-body">
          <div class="role">{{slot:role}}</div>
          <h4>{{slot:name}}</h4>
          <p>{{slot:bio}}</p>
        </div>
      </div>
{{/each}}    </div>
  </div>
</section>
