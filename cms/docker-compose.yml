# Postgres for local CMS development.
#
# SQLite was the first choice — no service to run — but Payload stores a
# global's fields as columns on one table, and the homepage has 183 of them.
# Reading it builds a json_array() with one argument per column, and SQLite
# caps that at 127. The limit is compiled into the driver, so there is no
# setting that lifts it: a page this wide needs Postgres.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: agree_tech_cms
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d agree_tech_cms']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
