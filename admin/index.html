<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content editor · Agree Technologies</title>
  <style>
    /*
      Fixed rather than in flow: Decap appends its own root to the body instead
      of replacing it, so a boot message that occupies layout space pushes the
      whole editor below the fold.
    */
    body { margin: 0; font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: #101A3A; }
    #boot { position: fixed; inset: 0; z-index: 0; display: grid; place-content: center; text-align: center; padding: 0 1.5rem; }
    #boot h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 .5rem; }
    #boot p { margin: 0; color: #56607A; }
  </style>
</head>
<body>
  <div id="boot">
    <h1>Loading the content editor…</h1>
    <p>If this message stays put, check your connection and reload the page.</p>
  </div>

  <!--
    Netlify Identity must load first: it is what answers the invite and
    password-recovery tokens that arrive in the URL fragment, and what Decap
    asks for a token when it talks to Git Gateway.
  -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!--
    Pinned and hashed: the editor holds the Identity token that Git Gateway
    turns into repository writes, so the bundle running here has to be the
    bytes that were reviewed, not whatever the CDN serves that day. The hash is
    sha384 of decap-cms@3.16.0/dist/decap-cms.js and is the same on unpkg and
    jsDelivr (both serve the npm tarball). When bumping the version, recompute:
      curl -sL https://unpkg.com/decap-cms@<v>/dist/decap-cms.js | openssl dgst -sha384 -binary | openssl base64 -A
    If unpkg fails — outage or hash mismatch — the same file is fetched from
    jsDelivr under the same hash.
  -->
  <script src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"
          integrity="sha384-WFBlw1ZGvgE9W2ia0r2gJPu3HOVweIpoHCGmlm3f/9J2OURAjzuJ/lV55gUd4By4"
          crossorigin="anonymous"></script>
  <script>
    if (!window.CMS) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/decap-cms@3.16.0/dist/decap-cms.js" integrity="sha384-WFBlw1ZGvgE9W2ia0r2gJPu3HOVweIpoHCGmlm3f/9J2OURAjzuJ/lV55gUd4By4" crossorigin="anonymous"><\/script>');
    }
  </script>
  <script>
    /*
     * Clear the boot message once the editor has actually rendered — not on
     * window load, which fires before Decap mounts.
     *
     * The test is "something other than us is on the page" rather than a Decap
     * class name, because those are generated and change between releases.
     * If the bundle never arrives, nothing matches and the message stays up,
     * which is the point of it.
     */
    (function () {
      var mine = /^(boot|netlify-identity)/;
      var tries = 0;

      var poll = setInterval(function () {
        var mounted = Array.prototype.some.call(document.body.children, function (el) {
          return el.tagName !== 'SCRIPT' && !mine.test(el.id || '');
        });
        if (!mounted && ++tries < 200) return;
        clearInterval(poll);
        if (mounted) {
          var boot = document.getElementById('boot');
          if (boot) boot.remove();
        }
      }, 100);
    })();
  </script>
</body>
</html>
