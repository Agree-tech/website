<meta name="robots" content="index, follow, max-image-preview:large" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Agree Technologies" />
<meta property="og:title" content="{{i18n:contact.meta.og-title}}" />
<meta property="og:description" content="{{i18n:contact.meta.og-description}}" />
<meta property="og:url" content="https://www.agree-tech.com/contact.html" />
<meta property="og:image" content="https://www.agree-tech.com/assets/og-default.png" />

<link rel="stylesheet" href="shared.css" />
<link rel="stylesheet" href="subpage.css" />
<style>
.contact-grid { display:grid; grid-template-columns: 1fr 1.1fr; gap:80px; align-items:start;}
.form-card { background:white; border:1px solid var(--border-soft); border-radius:18px; padding:36px; box-shadow:var(--shadow-card);}
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.field { margin-bottom:16px;}
.field label { display:block; font-size:13px; color:var(--slate); margin-bottom:6px; font-weight:500;}
.field label .req { color:var(--blue);}
.field input, .field select, .field textarea {
  width:100%; padding:11px 14px;
  border:1px solid var(--border); border-radius:10px;
  font-family:var(--f-body); font-size:14.5px; color:var(--ink);
  background:white;
  transition:border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline:none; border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,0.15);
}
.field textarea { min-height:120px; resize:vertical; font-family:var(--f-body);}
.consent { display:flex; gap:12px; align-items:flex-start; padding:14px; background:var(--mist); border-radius:10px; font-size:13px; color:var(--slate); line-height:1.55;}
.consent input { margin-top:3px;}
.contact-info-card { padding:36px; background:var(--navy); border-radius:18px; color:white; position:relative; overflow:hidden;}
.contact-info-card::before { content:""; position:absolute; inset:0; background:radial-gradient(500px 300px at 100% 0%, rgba(6,182,212,0.18), transparent 60%);}
.info-row { display:flex; gap:14px; padding:18px 0; border-top:1px solid rgba(255,255,255,0.1); position:relative;}
.info-row:first-of-type{border-top:0;}
.info-row .ico { width:36px; height:36px; border-radius:9px; background:rgba(6,182,212,0.18); color:var(--cyan-light); display:grid; place-items:center; flex:0 0 auto;}
.info-row b { color:white; font-weight:500;}
.info-row p { color:rgba(255,255,255,0.65); font-size:13.5px; margin-top:3px;}
.notice { background:#FEF3C7; border:1px solid #FDE68A; color:#92400E; padding:14px 16px; border-radius:10px; font-size:13.5px; line-height:1.55; margin-bottom:24px;}
.notice b { color:#78350F;}
@media (max-width:900px){ .contact-grid{grid-template-columns:1fr;} .form-row{grid-template-columns:1fr;} }
</style>
</head>
<body>
<script>window.AT_PAGE='contact';</script>
