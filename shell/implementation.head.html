<style>
.imp-rail { display:grid; grid-template-columns:repeat(4,1fr); gap:0; position:relative; margin-top:64px;}
.imp-rail::before { content:""; position:absolute; top:34px; left:6%; right:6%; height:2px; background:linear-gradient(90deg, var(--blue), var(--cyan)); border-radius:2px;}
.imp-step { position:relative; text-align:left; padding:0 18px;}
.imp-step .num-circle { width:68px; height:68px; border-radius:50%; background:white; border:2px solid var(--blue); color:var(--blue); display:grid; place-items:center; font-family:var(--f-display); font-weight:600; font-size:24px; margin:0 auto 22px; position:relative; z-index:1;}
.imp-step h3 { font-size:20px; text-align:center; margin-bottom:10px;}
.imp-step p { font-size:14px; color:var(--slate); text-align:center; line-height:1.55;}
@media (max-width: 900px){ .imp-rail { grid-template-columns:1fr 1fr;} .imp-rail::before{display:none;}}
@media (max-width: 540px){ .imp-rail { grid-template-columns:1fr;} }
</style>
