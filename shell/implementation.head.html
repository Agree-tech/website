<style>
.imp-rail { display:grid; grid-template-columns:repeat(6,1fr); gap:0; position:relative; margin-top:64px; counter-reset:step;}
.imp-rail::before { content:""; position:absolute; top:28px; left:8%; right:8%; height:2px; background:linear-gradient(90deg, var(--blue), var(--cyan)); border-radius:2px;}
.imp-step { position:relative; text-align:left; padding:0 10px;}
.imp-step .num-circle { width:56px; height:56px; border-radius:50%; background:white; border:2px solid var(--blue); color:var(--blue); display:grid; place-items:center; font-family:var(--f-display); font-weight:600; font-size:20px; margin:0 auto 20px; position:relative; z-index:1;}
.imp-step .num-circle::before { counter-increment:step; content:counter(step);}
.imp-step:nth-child(2) .num-circle { border-color:var(--cyan); color:var(--cyan-hover);}
.imp-step:nth-child(3) .num-circle { border-color:var(--violet); color:var(--violet);}
.imp-step:nth-child(4) .num-circle { border-color:var(--green); color:var(--green);}
.imp-step:nth-child(5) .num-circle { border-color:var(--navy); color:var(--navy);}
.imp-step:nth-child(6) .num-circle { border-color:var(--cyan); color:var(--cyan-hover);}
.imp-step h3 { font-size:17px; text-align:center; margin-bottom:10px; letter-spacing:-0.01em;}
.imp-step p { font-size:13.5px; color:var(--slate); text-align:center; line-height:1.55;}
@media (max-width: 1100px){ .imp-rail { grid-template-columns:repeat(3,1fr); row-gap:44px;} .imp-rail::before{display:none;}}
@media (max-width: 640px){ .imp-rail { grid-template-columns:1fr;} }
</style>
</head>
