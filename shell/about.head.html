<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{{i18n:about.meta.title}}</title>
<meta name="description" content="{{i18n:about.meta.description}}" />
<link rel="canonical" href="https://www.agree-tech.com/about.html" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Agree Technologies" />
<meta property="og:title" content="{{i18n:about.meta.og-title}}" />
<meta property="og:description" content="{{i18n:about.meta.og-description}}" />
<meta property="og:url" content="https://www.agree-tech.com/about.html" />
<meta property="og:image" content="https://www.agree-tech.com/assets/og-default.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{i18n:about.meta.twitter-title}}" />
<meta name="twitter:description" content="{{i18n:about.meta.twitter-description}}" />
<meta name="twitter:image" content="https://www.agree-tech.com/assets/og-default.png" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="shared.css" />
<link rel="stylesheet" href="subpage.css" />
<style>
.value-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border-soft); border:1px solid var(--border-soft); border-radius:18px; overflow:hidden;}
.value { background:white; padding:32px 28px;}
.value .ico { width:36px; height:36px; border-radius:9px; display:grid; place-items:center; margin-bottom:18px;}
.value h3 { font-size:18px; margin-bottom:8px;}
.value p { font-size:14px; color:var(--slate); line-height:1.55;}
.team-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:24px;}
.team-card { background:white; border:1px solid var(--border-soft); border-radius:18px; padding:28px; display:flex; gap:22px;}
.team-card .av { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--cyan)); color:white; display:grid; place-items:center; flex:0 0 auto; font-family:var(--f-display); font-weight:600; font-size:28px;}
.team-card.alt .av { background:linear-gradient(135deg,var(--violet),var(--blue));}
.team-card .role { font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em; color:var(--muted); text-transform:uppercase; margin-bottom:4px;}
.team-card h3 { font-size:20px; margin-bottom:6px;}
.team-card p { font-size:14px; color:var(--slate); line-height:1.55;}
.board-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:24px;}
.board { background:white; border:1px solid var(--border-soft); border-radius:18px; overflow:hidden; display:flex; flex-direction:column;}
.board-photo { aspect-ratio: 4/5; background:#EEF2F7; overflow:hidden; position:relative;}
.board-photo img { width:100%; height:100%; object-fit:cover; display:block; filter: grayscale(100%) contrast(1.02);}
.board-body { padding:22px 22px 26px;}
.board .role { font-family:var(--f-mono); font-size:10.5px; letter-spacing:0.14em; color:var(--muted); text-transform:uppercase;}
.board h4 { font-family:var(--f-display); font-size:18px; color:var(--navy); margin:6px 0 10px; letter-spacing:-0.01em;}
.board p { font-size:13.5px; color:var(--slate); line-height:1.55;}
@media (max-width:1100px){ .board-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:900px){ .value-grid{grid-template-columns:1fr 1fr;} .team-grid{grid-template-columns:1fr;} .board-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:640px){ .board-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<script>window.AT_PAGE='about';</script>
<div id="site-nav"></div>
