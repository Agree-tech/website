<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{{i18n:integrations.meta.title}}</title>
<meta name="description" content="{{i18n:integrations.meta.description}}" />
<link rel="canonical" href="https://www.agree-tech.com/integrations.html" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Agree Technologies" />
<meta property="og:title" content="{{i18n:integrations.meta.og-title}}" />
<meta property="og:description" content="{{i18n:integrations.meta.og-description}}" />
<meta property="og:url" content="https://www.agree-tech.com/integrations.html" />
<meta property="og:image" content="https://www.agree-tech.com/assets/og-default.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{i18n:integrations.meta.twitter-title}}" />
<meta name="twitter:description" content="{{i18n:integrations.meta.twitter-description}}" />
<meta name="twitter:image" content="https://www.agree-tech.com/assets/og-default.png" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="shared.css" />
<link rel="stylesheet" href="subpage.css" />
<style>
  .integrations-head { text-align:center; max-width:720px; margin:0 auto 36px; }
  .integrations-head .eyebrow { display:inline-flex; }
  .integrations-head h2 { font-family:var(--f-display); font-weight:600; font-size:clamp(28px,3vw,38px); color:var(--navy); letter-spacing:-0.015em; margin:14px 0 12px;}
  .integrations-head p { color:var(--slate); font-size:15.5px; line-height:1.65; }
  .integration-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .integration-cat { background:var(--white); border:1px solid var(--border-soft); border-radius:14px; padding:22px; transition:transform .2s ease, box-shadow .2s ease;}
  .integration-cat:hover { transform:translateY(-2px); box-shadow:0 8px 20px -10px rgba(15,23,42,0.18);}
  .integration-cat-label { font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em; color:var(--muted); text-transform:uppercase; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .integration-cat-label::before { content:""; width:6px; height:6px; border-radius:99px; background:var(--cyan);}
  .integration-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .integration-chip { font-family:var(--f-display); font-weight:500; font-size:13px; color:var(--navy); background:var(--cloud); padding:6px 12px; border-radius:99px; border:1px solid var(--border-soft);}
  .integration-foot { text-align:center; font-family:var(--f-mono); font-size:11px; color:var(--muted); letter-spacing:0.14em; margin-top:28px; text-transform:uppercase;}
  @media (max-width:1000px) { .integration-grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px) { .integration-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<script>window.AT_PAGE='integrations';</script>
<div id="site-nav"></div>
