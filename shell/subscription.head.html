<style>
.sub-mock {
  background: white; border: 1px solid var(--border-soft); border-radius: 16px; padding: 22px;
  box-shadow: var(--shadow-pop);
}
.sub-mock .row { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 12px; padding: 14px 0; border-top: 1px dashed var(--border-soft); align-items: center; font-size: 13.5px; }
.sub-mock .row.head { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; border-top: 0; padding-top: 0; }
.sub-mock .name { font-weight: 500; color: var(--navy); }
.sub-mock .name small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 2px; }
.sub-mock .arr { font-family: var(--f-mono); color: var(--navy); font-weight: 500; }
.sub-mock .pill { font-family: var(--f-mono); font-size: 10.5px; padding: 3px 9px; border-radius: 999px; }
.pill-active { background: #DCFCE7; color: #15803D; }
.pill-renewal { background: #DBEAFE; color: var(--blue); }
.pill-pause { background: #FEF3C7; color: #B45309; }
.usage-bar { height: 6px; background: var(--cloud); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.usage-bar > span { display: block; height: 100%; background: var(--green); }
</style>
