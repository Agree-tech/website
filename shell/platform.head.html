<style>
  .arch { background:var(--navy); border-radius:18px; padding:36px; color:white; box-shadow:var(--shadow-pop); position:relative; overflow:hidden;}
  .arch::before { content:""; position:absolute; inset:0; background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 16px); pointer-events:none;}
  .arch-row { position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px;}
  .arch-cell { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:14px; text-align:center;}
  .arch-cell .l { font-family:var(--f-mono); font-size:10px; letter-spacing:0.14em; color:rgba(255,255,255,0.55); text-transform:uppercase;}
  .arch-cell .v { font-family:var(--f-display); font-weight:600; color:white; margin-top:6px; font-size:14px;}
  .arch-cell.lead { background:linear-gradient(135deg, rgba(37,99,235,0.25), rgba(6,182,212,0.18)); border-color:rgba(6,182,212,0.4); }
  .arch-cell.lead .v { color:var(--cyan-light); }
  .arch-band { font-family:var(--f-mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.45); margin:14px 0 8px; text-align:center;}

  .integrations { margin-top:80px; }
  .integrations-head { text-align:center; max-width:680px; margin:0 auto 36px; }
  .integrations-head .eyebrow { display:inline-flex; }
  .integrations-head h3 { font-family:var(--f-display); font-weight:600; font-size:26px; color:var(--navy); letter-spacing:-0.01em; margin:14px 0 10px;}
  .integrations-head p { color:var(--muted); font-size:15px; line-height:1.6; }
  .integration-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .integration-cat { background:var(--white); border:1px solid var(--border-soft); border-radius:14px; padding:22px; transition:transform .2s ease, box-shadow .2s ease;}
  .integration-cat:hover { transform:translateY(-2px); box-shadow:0 8px 20px -10px rgba(15,23,42,0.18);}
  .integration-cat-label { font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em; color:var(--muted); text-transform:uppercase; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .integration-cat-label::before { content:""; width:6px; height:6px; border-radius:99px; background:var(--cyan);}
  .integration-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .integration-chip { font-family:var(--f-display); font-weight:500; font-size:13px; color:var(--navy); background:var(--cloud); padding:6px 12px; border-radius:99px; border:1px solid var(--border-soft);}
  .integration-foot { text-align:center; font-family:var(--f-mono); font-size:11px; color:var(--muted); letter-spacing:0.14em; margin-top:28px; text-transform:uppercase;}
  @media (max-width:1000px) { .integration-grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px) { .integration-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
