<style>
.bill-mock { background: var(--navy); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-pop); color:white;}
.bill-mock .head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; }
.bill-mock .ttl { font-family: var(--f-display); font-size:18px; font-weight:600; }
.bill-mock .sub { font-family: var(--f-mono); font-size:11px; letter-spacing:0.08em; color:rgba(255,255,255,0.55); margin-top:3px; text-transform:uppercase;}
.bill-stat-row { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom: 18px;}
.bill-stat { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:14px;}
.bill-stat .l { font-family:var(--f-mono); font-size:10px; letter-spacing:0.14em; color:rgba(255,255,255,0.55); text-transform:uppercase;}
.bill-stat .v { font-family:var(--f-display); font-size:22px; font-weight:600; margin-top:4px; letter-spacing:-0.02em;}
.bill-list { background:rgba(255,255,255,0.04); border-radius:10px; padding:6px; border:1px solid rgba(255,255,255,0.08);}
.bill-row { display:grid; grid-template-columns: 1fr auto auto; gap:14px; align-items:center; padding:10px 12px; font-size:13px; border-radius:8px;}
.bill-row + .bill-row { border-top:1px dashed rgba(255,255,255,0.08);}
.bill-row .id { font-family:var(--f-mono); color:rgba(255,255,255,0.55); font-size:11.5px;}
.bill-row .name { color:white; font-weight:500; }
.bill-row .name small { display:block; color:rgba(255,255,255,0.55); font-weight:400; font-size:11px; font-family:var(--f-mono); margin-top:2px;}
.bill-row .amt { font-family:var(--f-mono); color:white; font-weight:500;}
.bill-row .pill { font-family:var(--f-mono); font-size:10px; padding:3px 8px; border-radius:99px; }
</style>
