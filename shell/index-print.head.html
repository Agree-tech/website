<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>{{i18n:index-print.meta.title}}</title>
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://www.agree-tech.com/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="shared.css" />
<style>
  /* ===== PRINT STYLES ===== */
  @page { size: A4; margin: 14mm; }
  html, body { background: white !important; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  @media print {
    .topbar, #site-nav, .megamenu { display: none !important; }
    section { padding: 28px 0 !important; break-inside: avoid; page-break-inside: avoid; }
    .hero { padding: 24px 0 0 !important; break-after: page; }
    .hero-grid { gap: 30px !important; padding-bottom: 24px !important; }
    .hero h1 { font-size: 44px !important; line-height: 1.05 !important; }
    .hero .meta-row { margin-top: 24px !important; padding-top: 16px !important; }
    .logo-strip { padding: 0 0 24px !important; }
    .q2c { padding: 36px 0 !important; break-after: page; }
    .q2c-head { gap: 30px !important; margin-bottom: 24px !important; }
    .q2c-board { padding: 28px !important; }
    .modules { padding: 36px 0 !important; break-after: page; }
    .module-grid { gap: 14px !important; }
    .mod { padding: 22px !important; break-inside: avoid; }
    .quote { padding: 36px 0 !important; break-after: page; }
    .quote-grid { gap: 30px !important; }
    .innovate { padding: 36px 0 !important; break-after: page; }
    .inn-grid { gap: 30px !important; }
    .cta-band { padding: 36px 0 !important; }
    h1, h2, h3 { break-after: avoid; page-break-after: avoid; }
    .mock-float { display: none !important; }
    a { color: inherit !important; text-decoration: none !important; }
    .btn { box-shadow: none !important; }
    .hero-mock, .inn-vis, .q2c-board, .bill-mock { box-shadow: none !important; }
    img { max-width: 100% !important; }
  }
  /* ============ HOME PAGE ============ */
  .hero {
    position: relative;
    background: var(--navy);
    color: var(--white);
    overflow: hidden;
    padding: 120px 0 0;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(800px 400px at 88% -10%, rgba(6,182,212,0.18), transparent 70%),
      radial-gradient(700px 500px at 10% 110%, rgba(124,58,237,0.16), transparent 65%);
    pointer-events: none;
  }
  .hero-grid {
    position: relative;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 60px;
    align-items: center;
    padding-bottom: 80px;
  }
  .hero h1 {
    color: var(--white);
    font-size: clamp(48px, 6.4vw, 84px);
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 0.98;
  }
  .hero h1 .accent {
    color: var(--cyan-light);
    font-style: italic;
    font-weight: 400;
  }
  .hero .lede {
    color: rgba(255,255,255,0.72);
    font-size: 19px;
    margin-top: 26px;
    max-width: 520px;
    line-height: 1.55;
  }
  .hero .ctas { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }
  .hero .meta-row {
    margin-top: 56px;
    display: flex; gap: 36px;
    border-top: 1px solid rgba(255,255,255,0.12);
    padding-top: 28px;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    font-family: var(--f-mono);
    letter-spacing: 0.04em;
  }
  .hero .meta-row b { color: var(--white); font-weight: 500; }

  /* Hero product mock */
  .hero-mock {
    position: relative;
    background: var(--navy-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 18px;
    box-shadow: var(--shadow-pop);
  }
  .hero-mock::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(6,182,212,0.25), transparent 30%);
    pointer-events: none;
    z-index: -1;
  }
  .mock-tab-row {
    display: flex; gap: 6px; align-items: center;
    padding: 4px 6px 14px;
  }
  .mock-tab-row .dot { width: 9px; height: 9px; border-radius: 50%; }
  .mock-tab-row .d1 { background: #ef4444; } .mock-tab-row .d2 { background: #f59e0b; } .mock-tab-row .d3 { background: #22c55e; }
  .mock-tab-row .url {
    margin-left: 16px;
    flex: 1;
    background: rgba(255,255,255,0.06);
    border-radius: 7px;
    padding: 6px 12px;
    font-family: var(--f-mono);
    font-size: 11.5px;
    color: rgba(255,255,255,0.6);
  }
  .mock-body {
    background: var(--white);
    border-radius: 12px;
    padding: 22px;
    color: var(--ink);
  }
  .mock-head {
    display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px;
  }
  .mock-head .ttl { font-family: var(--f-display); font-size: 17px; font-weight: 600; color: var(--navy); letter-spacing: -0.02em; }
  .mock-head .sub { font-size: 12px; color: var(--muted); margin-top: 3px; font-family: var(--f-mono); letter-spacing: 0.04em; }
  .mock-head .pill {
    background: #DCFCE7; color: #15803D;
    font-size: 11px; font-weight: 500;
    padding: 4px 10px; border-radius: 999px;
    font-family: var(--f-mono); letter-spacing: 0.06em;
  }
  .mock-line { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px dashed var(--border-soft); font-size: 13px; }
  .mock-line:last-child { border: 0; }
  .mock-line .l { color: var(--slate); }
  .mock-line .r { font-family: var(--f-mono); color: var(--navy); font-weight: 500; }
  .mock-total {
    margin-top: 14px; padding: 14px 16px;
    background: var(--navy); color: var(--white); border-radius: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .mock-total .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.6); }
  .mock-total .amt { font-family: var(--f-display); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .mock-actions { display: flex; gap: 8px; margin-top: 14px; }
  .mock-btn {
    flex: 1;
    padding: 9px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 500;
    text-align: center;
    background: var(--blue); color: white;
  }
  .mock-btn.alt { background: white; color: var(--navy); border: 1px solid var(--border); }
  /* Floating mini card */
  .mock-float {
    position: absolute;
    background: white;
    border-radius: 12px;
    box-shadow: 0 16px 32px -8px rgba(0,0,0,0.35);
    padding: 14px 16px;
    width: 230px;
    border: 1px solid var(--border-soft);
  }
  .mock-float-1 {
    top: 32px; right: -28px;
  }
  .mock-float-2 {
    bottom: 40px; left: -38px;
  }
  .mock-float .ico {
    width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center;
    color: white; margin-bottom: 8px;
  }
  .mock-float .label { font-size: 11px; color: var(--muted); font-family: var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .mock-float .val { font-size: 18px; font-weight: 600; color: var(--navy); font-family: var(--f-display); margin-top: 2px; letter-spacing: -0.02em;}
  .mock-float .delta { font-size: 12px; color: var(--green); font-family: var(--f-mono); margin-top: 4px; }

  /* Logos */
  .logo-strip {
    background: var(--navy);
    padding: 0 0 60px;
    color: rgba(255,255,255,0.4);
  }
  .logo-strip .label {
    text-align: center;
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 32px;
    color: rgba(255,255,255,0.4);
  }
  .logos {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 28px;
    align-items: center;
    opacity: 0.7;
  }
  .logos .lg {
    text-align: center;
    font-family: var(--f-display);
    color: rgba(255,255,255,0.65);
    font-weight: 500;
    font-size: 17px;
    letter-spacing: -0.01em;
    padding: 10px;
  }
  .logos .lg.serif { font-family: "Times New Roman", serif; font-style: italic; }
  .logos .lg.mono { font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }
  .logos .lg.bold { font-weight: 700; }

  /* Quote-to-cash strip */
  .q2c {
    background: var(--mist);
    padding: 110px 0 80px;
    border-top: 1px solid var(--border-soft);
  }
  .q2c-head {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 80px;
    align-items: end;
    margin-bottom: 56px;
  }
  .q2c-head h2 { color: var(--navy); }
  .q2c-head .right p { font-size: 17px; color: var(--slate); margin-bottom: 22px; }
  .q2c-head .right .ctas { display: flex; gap: 10px; }
  .q2c-board {
    background: var(--navy);
    border-radius: 22px;
    padding: 56px 48px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .q2c-board::before {
    content: "";
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(135deg,
      rgba(255,255,255,0.025) 0 1px,
      transparent 1px 18px);
    pointer-events: none;
  }
  .q2c-rail {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 36px;
  }
  .q2c-rail::before {
    content: "";
    position: absolute;
    top: 22px;
    left: 8%;
    right: 8%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(6,182,212,0.6) 20%, rgba(6,182,212,0.6) 80%, transparent);
  }
  .q2c-stage {
    position: relative;
    text-align: center;
  }
  .q2c-stage .node {
    width: 44px; height: 44px;
    border-radius: 11px;
    background: var(--navy-2);
    border: 1px solid rgba(6,182,212,0.5);
    display: grid; place-items: center;
    margin: 0 auto 14px;
    color: var(--cyan-light);
    position: relative; z-index: 1;
  }
  .q2c-stage .lbl {
    font-family: var(--f-mono);
    font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cyan-light);
  }
  .q2c-cards {
    position: relative;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .q2c-card {
    background: white;
    color: var(--ink);
    border-radius: 14px;
    padding: 18px;
    min-height: 140px;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5);
  }
  .q2c-card .ttl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .q2c-card .num { font-family: var(--f-display); font-size: 22px; font-weight: 600; color: var(--navy); letter-spacing: -0.02em; }
  .q2c-card .note { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: var(--f-mono); }
  .q2c-card .pill {
    display: inline-block;
    margin-top: 10px;
    background: #DBEAFE; color: var(--blue);
    font-size: 10px; padding: 3px 8px; border-radius: 999px;
    font-family: var(--f-mono); letter-spacing: 0.06em;
  }
  .q2c-card.green .num { color: var(--green); }
  .q2c-card .bars {
    display: flex; gap: 4px; align-items: flex-end; height: 38px; margin-top: 10px;
  }
  .q2c-card .bars span {
    flex: 1; background: var(--blue); border-radius: 2px;
    opacity: 0.85;
  }

  /* Modules */
  .modules {
    padding: 110px 0;
    background: white;
  }
  .module-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  .mod {
    position: relative;
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 22px;
    padding: 36px;
    overflow: hidden;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .mod:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-card);
    border-color: var(--border);
  }
  .mod .acc-stripe {
    position: absolute; top: 0; left: 36px; right: 36px; height: 3px;
    background: var(--acc, var(--blue));
    border-radius: 0 0 3px 3px;
  }
  .mod .head {
    display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px;
  }
  .mod .num {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--muted);
  }
  .mod .ico {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--acc-soft);
    color: var(--acc);
    display: grid; place-items: center;
  }
  .mod h3 { font-size: 26px; margin: 14px 0 10px; }
  .mod p { font-size: 15px; line-height: 1.55; max-width: 520px; }
  .mod .vis {
    margin-top: 22px;
    background: var(--mist);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 18px;
    min-height: 130px;
  }
  .mod .more {
    margin-top: 22px;
    font-family: var(--f-body);
    color: var(--acc);
    font-weight: 500;
    font-size: 14px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .mod .more:hover { gap: 10px; }

  /* Mod-specific visuals */
  .vis-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 12.5px; border-bottom: 1px dashed var(--border-soft); }
  .vis-row:last-child { border: 0; }
  .vis-row .l { color: var(--slate); font-family: var(--f-mono); letter-spacing: 0.04em; font-size: 11.5px; text-transform: uppercase; }
  .vis-row .r { color: var(--navy); font-family: var(--f-mono); font-weight: 500; }
  .vis-row .pill { background: #DCFCE7; color: #15803D; padding: 2px 8px; border-radius: 99px; font-size: 10.5px; font-family: var(--f-mono); }
  .vis-row .pill.blue { background: #DBEAFE; color: var(--blue); }
  .vis-row .pill.violet { background: #EDE9FE; color: var(--violet); }

  .vis-flow {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    gap: 8px;
    align-items: center;
  }
  .vis-flow .node {
    background: white; border: 1px solid var(--border-soft); border-radius: 8px;
    padding: 10px 12px; text-align: center;
  }
  .vis-flow .node .n-l { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
  .vis-flow .node .n-v { font-family: var(--f-display); font-size: 14px; font-weight: 600; color: var(--navy); margin-top: 2px; }
  .vis-flow .arr { color: var(--cyan); }

  /* Quote */
  .quote {
    padding: 120px 0;
    background: var(--mist);
    border-top: 1px solid var(--border-soft);
  }
  .quote-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }
  .quote blockquote {
    margin: 0;
    font-family: var(--f-display);
    font-size: clamp(28px, 2.8vw, 38px);
    line-height: 1.18;
    color: var(--navy);
    font-weight: 500;
    letter-spacing: -0.025em;
  }
  .quote blockquote .em { color: var(--blue); font-style: italic; font-weight: 400; }
  .quote .attr {
    margin-top: 28px;
    display: flex; gap: 14px; align-items: center;
  }
  .quote .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    color: white; display: grid; place-items: center;
    font-family: var(--f-display); font-weight: 600;
  }
  .quote .who { font-weight: 500; color: var(--navy); }
  .quote .who small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; margin-top: 2px; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border-soft);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    overflow: hidden;
  }
  .stat {
    background: white;
    padding: 36px 28px;
  }
  .stat .v {
    font-family: var(--f-display);
    font-size: 56px;
    font-weight: 600;
    letter-spacing: -0.04em;
    color: var(--navy);
    line-height: 1;
  }
  .stat .v small { font-size: 22px; color: var(--blue); margin-left: 4px; vertical-align: middle; }
  .stat .l { font-size: 14px; color: var(--slate); margin-top: 12px; }

  /* Innovate band */
  .innovate {
    background: var(--navy);
    color: white;
    padding: 120px 0;
    position: relative;
    overflow: hidden;
  }
  .innovate::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(700px 400px at 90% 50%, rgba(124,58,237,0.18), transparent 60%),
      radial-gradient(600px 360px at 10% 100%, rgba(6,182,212,0.15), transparent 60%);
  }
  .inn-grid {
    position: relative;
    display: grid; grid-template-columns: 1fr 1fr; gap: 80px;
    align-items: center;
  }
  .innovate h2 { color: white; }
  .innovate .lede {
    color: rgba(255,255,255,0.7); font-size: 18px; margin-top: 22px; max-width: 480px;
  }
  .inn-list { margin-top: 32px; }
  .inn-list li {
    list-style: none;
    padding: 14px 0;
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; gap: 14px; align-items: center;
    font-size: 16px;
  }
  .inn-list li:last-child { border-bottom: 1px solid rgba(255,255,255,0.1); }
  .inn-list .check {
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(6,182,212,0.18); color: var(--cyan-light);
    display: grid; place-items: center; flex: 0 0 auto;
  }
  .inn-list .check svg { width: 12px; height: 12px; }
  .innovate .ctas { margin-top: 36px; display: flex; gap: 10px; }
  /* Right-side analytics mock */
  .inn-vis {
    background: var(--navy-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 28px;
    box-shadow: var(--shadow-pop);
  }
  .inn-vis-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
  .inn-vis-head .t { font-family: var(--f-display); font-size: 17px; color: white; font-weight: 500; }
  .inn-vis-head .s { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.14em; color: rgba(255,255,255,0.5); text-transform: uppercase; margin-top: 3px; }
  .inn-vis-head .pill {
    background: rgba(22,163,74,0.18); color: #4ade80;
    padding: 4px 10px; border-radius: 99px; font-size: 11px; font-family: var(--f-mono);
  }
  .inn-chart {
    height: 180px;
    background:
      linear-gradient(to top, rgba(6,182,212,0.18), transparent 80%);
    border-radius: 10px;
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .inn-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .inn-grid-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 22px; }
  .inn-stat {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 14px;
  }
  .inn-stat .l { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; color: rgba(255,255,255,0.5); text-transform: uppercase; }
  .inn-stat .v { font-family: var(--f-display); font-size: 22px; color: white; font-weight: 600; margin-top: 4px; letter-spacing: -0.02em; }
  .inn-stat .d { font-family: var(--f-mono); font-size: 11px; color: #4ade80; margin-top: 4px; }

  /* CTA close */
  .cta-band {
    background: white;
    padding: 110px 0;
    text-align: center;
  }
  .cta-band h2 {
    font-size: clamp(40px, 5vw, 64px);
  }
  .cta-band .lede { font-size: 18px; color: var(--slate); margin-top: 22px; max-width: 600px; margin-inline: auto; }
  .cta-band .ctas { margin-top: 36px; display: flex; gap: 10px; justify-content: center; }

  @media (max-width: 1000px) {
    .hero-grid, .q2c-head, .quote-grid, .module-grid, .inn-grid { grid-template-columns: 1fr; gap: 40px; }
    .q2c-rail, .q2c-cards { grid-template-columns: repeat(5, 1fr); font-size: 11px; }
    .logos { grid-template-columns: repeat(3, 1fr); }
    .stats { grid-template-columns: 1fr; }
    .mock-float { display: none; }
  }
</style>
</head>
