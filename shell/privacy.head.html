<style>
  /* A legal page is one long document, not a sequence of marketing bands, so
     the blocks run together on a single surface and only a part heading opens
     a new stretch of vertical space. */
  .legal { max-width: 860px; }
  .legal-block { padding: 0; }
  .legal-block.legal-start { padding-top: 72px; }
  .legal-block:last-of-type { padding-bottom: 104px; }
  .legal-title { font-family:var(--f-display); font-weight:600; font-size:30px; color:var(--navy); letter-spacing:-0.015em; margin:14px 0 10px;}
  .legal h3 { font-family:var(--f-display); font-weight:600; font-size:19px; color:var(--navy); letter-spacing:-0.01em; margin:36px 0 10px;}
  .legal h4 { font-family:var(--f-display); font-weight:600; font-size:15.5px; color:var(--navy); margin:26px 0 8px;}
  .legal p { color:var(--slate); font-size:15px; line-height:1.72; margin:0 0 14px;}
  .legal-bullets { margin:0 0 14px; padding-left:20px; color:var(--slate); font-size:15px; line-height:1.72;}
  .legal-bullets li { margin:0 0 6px;}
  @media (max-width:700px) { .legal-title { font-size:26px; } .legal-block.legal-start { padding-top:56px; } }
</style>
