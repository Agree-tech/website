<style>
.cpq-mock {
  background: white; border: 1px solid var(--border-soft); border-radius: 16px;
  box-shadow: var(--shadow-pop); overflow: hidden;
}
.cpq-mock .bar { display: flex; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--border-soft); align-items:center; }
.cpq-mock .bar .d { width: 9px; height: 9px; border-radius:50%; }
.cpq-mock .bar .url { margin-left: 12px; flex:1; background: var(--cloud); border-radius: 6px; padding: 5px 10px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.cpq-mock .body { padding: 22px; }
.cpq-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; padding: 12px 14px; align-items: center; border-bottom: 1px dashed var(--border-soft); font-size: 13px; }
.cpq-row.head { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; padding-top: 0; padding-bottom: 10px; border-bottom: 1px solid var(--border-soft); }
.cpq-row .name { font-weight: 500; color: var(--navy); }
.cpq-row .qty { font-family: var(--f-mono); color: var(--slate); }
.cpq-row .price { font-family: var(--f-mono); color: var(--navy); font-weight: 500; text-align: right; }
.cpq-row .disc { color: var(--green); font-family: var(--f-mono); font-size: 12px; }
.cpq-total { display: flex; justify-content: space-between; align-items: center; padding: 18px 14px; background: var(--navy); color: white; border-radius: 10px; margin-top: 14px; }
.cpq-total .l { font-family: var(--f-mono); letter-spacing: 0.14em; font-size: 11px; text-transform: uppercase; opacity: 0.7; }
.cpq-total .a { font-family: var(--f-display); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }

.lang-pills { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.lang-pills span { font-family: var(--f-mono); font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--cloud); color: var(--slate); }
.lang-pills span.on { background: var(--blue); color: white; }

.crm-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.crm-card { background:white; border:1px solid var(--border-soft); border-radius:14px; padding:22px; box-shadow:var(--shadow-card); transition:transform .15s ease, box-shadow .15s ease; }
.crm-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-pop); }
.crm-card .badge { width:44px; height:44px; border-radius:11px; display:grid; place-items:center; font-family:var(--f-display); font-weight:700; font-size:18px; color:white; margin-bottom:14px; }
.crm-card .name { font-family:var(--f-display); font-weight:600; color:var(--navy); font-size:16px; }
.crm-card .meta { font-family:var(--f-mono); font-size:11px; letter-spacing:0.12em; color:var(--muted); text-transform:uppercase; margin-top:4px; }
.crm-card p { color:var(--slate); font-size:13.5px; line-height:1.55; margin-top:12px; }
.crm-hubspot { background:#FF7A59; }
.crm-pipedrive { background:#1A1A1A; }
.crm-salesforce { background:#00A1E0; }
.crm-dynamics { background:#5E2B97; }
.sync-flow { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px; padding:18px 22px; background:var(--cloud); border-radius:12px; margin-top:20px; }
.sync-flow .side { font-family:var(--f-display); font-weight:600; color:var(--navy); font-size:14px; }
.sync-flow .arrows { font-family:var(--f-mono); color:var(--blue); font-size:18px; letter-spacing:-2px; }
.sync-flow .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.sync-flow .tag { font-family:var(--f-mono); font-size:10.5px; letter-spacing:0.06em; color:var(--slate); background:white; border:1px solid var(--border-soft); padding:3px 8px; border-radius:99px; }
@media (max-width: 600px) { .crm-grid { grid-template-columns:1fr; } .sync-flow { grid-template-columns:1fr; text-align:center; } }
</style>
</head>
