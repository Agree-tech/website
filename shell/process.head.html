<style>
.flow-mock { background:white; border:1px solid var(--border-soft); border-radius:16px; padding:28px; box-shadow:var(--shadow-pop); position:relative; overflow:hidden; min-height:410px;}
.flow-mock svg.bg { position:absolute; inset:0; width:100%; height:100%; opacity:0.6;}
.flow-note { position:absolute; left:0; right:0; bottom:14px; text-align:center; color:var(--slate);}
.flow-node { position:absolute; background:white; border:1px solid var(--border-soft); border-radius:10px; padding:10px 14px; font-size:12.5px; box-shadow:0 6px 12px -4px rgba(15,23,42,0.08); display:flex;align-items:center;gap:10px;}
.flow-node .ico { width:24px; height:24px; border-radius:6px; display:grid;place-items:center; color:white; flex:0 0 auto;}
.flow-node b { color: var(--navy); font-weight:500; font-size:13px; }
.flow-node small { display:block; color: var(--muted); font-family:var(--f-mono); font-size:10.5px; letter-spacing:0.06em; margin-top:1px; text-transform:uppercase;}
.app-shot { margin: 0; }
.app-shot img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-pop);
}
.app-shot figcaption {
  margin-top: 12px;
  text-align: center;
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--slate);
}
</style>
</head>
